spring.application.name=hospedagem

# Perfil padrao usa H2 em memoria (sem precisar instalar MySQL para testar).
# Para usar MySQL, rode com:  --spring.profiles.active=mysql
spring.profiles.active=h2

server.port=8080

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
